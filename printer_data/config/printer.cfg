# 	Probe
#####################################################################


#####################################################################
# 	Fan Control
#####################################################################
[fan]
##	Print Cooling Fan - CNC_FAN0
pin: EBB:gpio4 #PA8
kick_start_time: 0.5
##	Depending on your fan, you may need to increase this value
##	if your fan will not start. Can change cycle_time (increase)
##	if your fan is not able to slow down effectively
off_below: 0.10
##--------------------------------------------------------------------
[heater_fan Hotend_fan]
##	 - CNC_FAN1
pin: EBB:gpio14 #PE5
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0
##	If you are experiencing back flow, you can reduce fan_speed
#fan_speed: 1.0
##--------------------------------------------------------------------
[heater_fan ebb_fan]
##	Hotend Fan - CNC_FAN1
pin: EBB:gpio5 #PE5
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0
##	If you are experiencing back flow, you can reduce fan_speed
fan_speed: 0.6
##--------------------------------------------------------------------
[fan_generic controller_fan]
##	Controller fan - CNC_FAN2
pin: PD12
max_power: 1.0
kick_start_time: 0.5
